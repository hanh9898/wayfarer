# Customization surface for the scripture-intake skill — base layer, ships with the plugin,
# overwritten on every update.
#
# Personal layer (yours to edit): ~/.wayfarer/custom/scripture-intake.toml — write SPARSELY,
# only the fields you want to change. A valid personal file, copy it as-is:
#
#     [token_budget]
#     heavy = 100000
#
# Merged result: light = 60000 (kept from the base layer), heavy = 100000 (personal layer wins).
#
# Only token_budget is exposed in this version. The two fields scripture_template and
# phase2_reviewers belong to scripture-intake per the overall design document, but both mean
# something only in the pedagogy-design phase — that phase is not built, so no step reads them.
# Deliberately left out rather than invented.

[token_budget]
# Comparison marks for the cost estimate in the fourth appraisal. Unit: tokens of all the text
# extracted, NOT the cost of extracting it — extraction takes seconds even for a 500-page book.
# light must stay below heavy; the skill checks this after merging and warns if they are inverted.
light = 60000   # below this: a thin book, later phases run comfortably
heavy = 150000  # above this: a heavy book, say so up front so the learner expects many turns later
