# Customization surface for the sect-master skill — base layer, ships with the plugin,
# overwritten on every update.
# Personal layer (yours to edit): ~/.wayfarer/custom/sect-master.toml — write only the fields you
# want to change (sparse override), merged by rule: scalars overwrite. Full merge rules are in
# sect-master/SKILL.md under "Load customize.toml".
#
# Only counsel_count is exposed in this version. persistent_facts and catalog_them belong to
# sect-master per the overall design document, but no step reads them yet — deliberately left
# out rather than invented.

[counsel_count]
# Branch "already knows what to train" (meridian_source = self_declared in profile.json)
decided = { technique = 3, heart-method = 2 }
# Branch "does not yet know what to train" (meridian_source = inferred_from_role in profile.json)
undecided = { technique = 1, heart-method = 1 }
