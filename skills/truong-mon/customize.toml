# Bề mặt tuỳ biến của skill truong-mon — lớp gốc, theo plugin, ghi đè mỗi lần cập nhật.
# Lớp cá nhân (sửa được): ~/.vandao/custom/truong-mon.toml — chỉ ghi trường muốn đổi (override thưa),
# gộp theo luật: scalar ghi đè, đọc chi tiết cách gộp ở truong-mon/SKILL.md mục "Nạp customize.toml".
#
# Chỉ so_chi_diem được phơi ra ở bản này. persistent_facts và catalog_them thuộc truong-mon
# theo tài liệu thiết kế chung nhưng chưa có bước đọc nào dùng tới — cố ý để trống, không bịa field.

[so_chi_diem]
# Nhánh "đã biết muốn luyện gì" (mach_nguon = tu_khai trong ho-so.json)
da_biet = { cong_phap = 3, tam_phap = 2 }
# Nhánh "chưa biết muốn luyện gì" (mach_nguon = suy_tu_vai trong ho-so.json)
chua_biet = { cong_phap = 1, tam_phap = 1 }
